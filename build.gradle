plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// owo-lib (GUI declarativa)
	maven { url = 'https://maven.wispforest.io/releases/' }
	// owo depende de kdl4j, que solo se publica en JitPack
	maven { url = 'https://jitpack.io' }

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// El nombre del jar queda como chest_shield-1.0.0+26.1.2.jar
// El sufijo +<mc> es metadato de build de semver, y es la convencion que usan
// fabric-api y owo-lib: deja claro para que Minecraft sirve cada archivo.
version = "${project.mod_version}+${project.minecraft_version}"

loom {
	splitEnvironmentSourceSets()

	mods {
		"chest_shield" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// owo-lib: interfaces graficas.
	// Loom 1.17 elimino modImplementation; el remapeo de mods ya es automatico.
	implementation "io.wispforest:owo-lib:${project.owo_version}"
}

// El "sentinel" de owo se empaqueta dentro del jar para avisar al jugador que le
// falta owo-lib en vez de que le reviente el juego. Solo si Loom expone 'include'.
if (configurations.findByName('include') != null) {
	dependencies.add('include', "io.wispforest:owo-sentinel:${project.owo_version}")
} else {
	logger.lifecycle("AVISO: Loom no expone la configuracion 'include'; owo-sentinel no se empaquetara.")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Revisa las texturas del mod y avisa de los dos defectos que rompen el render:
// alfa intermedio (el modelo usa entityCutoutCull, que no mezcla) y exceso de
// colores, sintoma de haber pintado con opacidad menor al 100%.
// Uso: .\gradlew verificarTexturas
tasks.register('verificarTexturas') {
	group = 'verification'
	description = 'Avisa de texturas con alfa intermedio o con antialias'

	def raiz = file('src/main/resources/assets')

	doLast {
		int problemas = 0
		raiz.eachFileRecurse { archivo ->
			if (!archivo.name.endsWith('.png')) return
			def img = javax.imageio.ImageIO.read(archivo)
			if (img == null) return

			int semitransparentes = 0
			def colores = new HashSet<Integer>()
			for (int y = 0; y < img.height; y++) {
				for (int x = 0; x < img.width; x++) {
					int argb = img.getRGB(x, y)
					int alfa = (argb >>> 24) & 0xFF
					if (alfa != 0 && alfa != 255) semitransparentes++
					if (alfa != 0) colores.add(argb & 0xFFFFFF)
				}
			}

			def nombre = raiz.toPath().relativize(archivo.toPath()).toString()
			if (semitransparentes > 0) {
				logger.lifecycle("  [ALFA]  ${nombre}: ${semitransparentes} px con alfa intermedio. Deben ser 0 o 255.")
				problemas++
			}
			if (colores.size() > 96) {
				logger.lifecycle("  [COLOR] ${nombre}: ${colores.size()} colores distintos (una textura vanilla usa ~60).")
				logger.lifecycle("          Sintoma de pintar con opacidad < 100%: los bordes quedan con colores mezclados.")
				problemas++
			}
		}
		if (problemas == 0) {
			logger.lifecycle('Texturas OK: alfa binario y paleta contenida.')
		}
	}
}

// Tarea de apoyo: copia el jar de owo-lib (y sus fuentes) dentro del proyecto,
// para poder inspeccionar su API sin depender del cache global de Gradle.
// Uso: panel Gradle > chest_shield > Tasks > other > exportarOwo
tasks.register('exportarOwo', Copy) {
	group = 'help'
	description = 'Copia owo-lib a libs-inspeccion/ para consultar su API'

	def fuentes = configurations.detachedConfiguration(
			dependencies.create("io.wispforest:owo-lib:${project.owo_version}:sources")
	)
	fuentes.transitive = false

	from(fuentes)
	from({ configurations.compileClasspath.filter { it.name.toLowerCase().contains('owo') } })
	into(layout.projectDirectory.dir('libs-inspeccion'))
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
